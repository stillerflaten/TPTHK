<!doctype html>
<html lang="nb">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Hvilke kilder siden får hente skript, stiler og data fra. Stopper skript som er lurt inn fra andre steder.

  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://www.gstatic.com http://127.0.0.1:* http://localhost:* ws://127.0.0.1:* ws://localhost:*; frame-src 'self' blob: https://tpthk-3405f.firebaseapp.com; object-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'">

  <meta name="theme-color" content="#151513">
  <!-- «?v=3» gir ikonene nye adresser, så iPhone ikke gjenbruker en mislykket henting den har husket fra før. -->
  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="icon" href="icons/favicon-32.png?v=3" type="image/png" sizes="32x32">
  <link rel="icon" href="icons/icon-192.png?v=3" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=3" sizes="180x180">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
