# Publiserer sikkerhetsreglene (firestore.rules) til Firebase når de endres på main.
# Krever hemmeligheten FIREBASE_SERVICE_ACCOUNT, se docs/regler-automatisk.md.
# Uten den hoppes publiseringen over, og reglene må limes inn i Firebase-konsollen som før.
name: Publiser sikkerhetsreglene

on:
  push:
    branches: [main]
    paths: [firestore.rules]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regler
  cancel-in-progress: false

jobs:
  regler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sjekk at nøkkelen finnes
        id: sjekk
        env:
          NOKKEL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$NOKKEL" ]; then
            echo "::warning::Hemmeligheten FIREBASE_SERVICE_ACCOUNT mangler. Reglene ble IKKE publisert. Lim dem inn i Firebase-konsollen, eller følg docs/regler-automatisk.md."
            echo "har=nei" >> "$GITHUB_OUTPUT"
          else
            echo "har=ja" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.sjekk.outputs.har == 'ja'
        with:
          node-version: 22
      - name: Publiser reglene
        if: steps.sjekk.outputs.har == 'ja'
        env:
          NOKKEL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$NOKKEL" > "$RUNNER_TEMP/nokkel.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/nokkel.json"
          npx --yes firebase-tools@14 deploy --only firestore:rules --project tpthk-3405f --non-interactive
          rm -f "$RUNNER_TEMP/nokkel.json"
